name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm 10 (Node 22) fails to resolve the libraries' peer sets without a lock file: "Cannot read properties
          # of null (reading 'edgesOut')".
          node-version: '24'
      - run: npm ci
      # eslint, markdownlint and tsc, report only.
      - run: npm run lint
      # Checks out every library submodule at its latest commit, builds their documentation and demos, then the hub.
      # The private submodule (libs/vab) cannot be cloned here; its pages are skipped.
      - run: npm run docs:build

  all-green:
    if: always()
    needs: [node]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
